AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for local testing of Sensor API

# Environment variables are loaded from env.json (generated from .env.local)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x

Resources:
  SensorApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: ./dist
      Events:
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - index.ts

Outputs:
  SensorApiUrl:
    Description: "API Gateway endpoint URL for local testing"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  SensorApiFunction:
    Description: "Sensor API Lambda Function ARN"
    Value: !GetAtt SensorApiFunction.Arn
