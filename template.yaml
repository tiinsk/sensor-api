AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for local testing of Sensor API

# Environment variables are loaded from env.json (generated from .env.local)

Parameters:
  JWT_SECRET:
    Type: String
  AWS_REGION:
    Type: String
  NODE_ENV:
    Type: String
  USE_LOCAL_DB:
    Type: String


Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs18.x

Resources:
  SensorApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: ./dist/bundle
      Environment:
        Variables:
          JWT_SECRET: !Ref JWT_SECRET
          AWS_REGION: !Ref AWS_REGION
          NODE_ENV: !Ref NODE_ENV
          USE_LOCAL_DB: !Ref USE_LOCAL_DB
      Events:
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  SensorApiUrl:
    Description: "API Gateway endpoint URL for local testing"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  SensorApiFunction:
    Description: "Sensor API Lambda Function ARN"
    Value: !GetAtt SensorApiFunction.Arn
